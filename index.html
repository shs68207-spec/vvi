<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haifa · Bride-to-Be Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#a94a2b;--gold:#ecb77a;--gold2:#f5cd96;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--gold);font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden}
.wrap{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 5px),repeating-linear-gradient(-45deg,rgba(0,0,0,.04) 0 2px,transparent 2px 5px),radial-gradient(ellipse at 50% 30%,#b8532f,#9c4126 80%)}
.drip{position:absolute;top:0;width:34%;max-width:200px;height:48%;object-fit:cover;opacity:.9;pointer-events:none;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.drip.l{left:0}.drip.r{right:0}
.logo{width:min(34vw,140px);height:auto;position:relative;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;transition:opacity .9s ease,transform .9s ease}
#intro{z-index:2}
#intro.gone{opacity:0;transform:scale(1.04);pointer-events:none}
#card{opacity:0;transform:translateY(14px);pointer-events:none}
#card.show{opacity:1;transform:none;pointer-events:auto;transition-delay:.35s}
h1{font-family:'Playfair Display',serif;font-weight:400;letter-spacing:.12em;text-transform:uppercase;font-size:clamp(17px,5vw,24px);margin:34px 0 14px;color:var(--gold2)}
.sub{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(18px,5vw,24px);margin:0 0 40px}
.btn{font:500 16px 'Cormorant Garamond',serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);background:transparent;border:1.5px solid var(--gold);padding:18px 34px;cursor:pointer;transition:background .3s}
.btn:hover,.btn:active{background:rgba(236,183,122,.15)}
.name{font-family:'Playfair Display',serif;font-size:clamp(46px,16vw,76px);letter-spacing:.1em;margin:18px 0 22px;color:var(--gold2);line-height:1}
.msg{font-size:clamp(14px,3.9vw,18px);letter-spacing:.12em;text-transform:uppercase;line-height:1.7;max-width:440px;margin:0 0 34px}
.info{display:flex;align-items:stretch;justify-content:center;width:100%;max-width:460px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;color:inherit;text-decoration:none;padding:0 6px}
.col+.col{border-left:1px solid rgba(236,183,122,.7)}
.col svg{width:38px;height:38px;fill:none;stroke:var(--gold);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-size:15px;letter-spacing:.22em;text-transform:uppercase;margin-top:6px}
.val{font-size:clamp(15px,4.2vw,19px);letter-spacing:.04em}
a.col .val{border-bottom:1px solid var(--gold);padding-bottom:1px}
.hint{margin-top:10px;font-size:13px;opacity:.75;letter-spacing:.1em}
</style></head><body>
